# -------------------------------------------------------------------
# COMANDO D (Definir Tipo de VM)
# Sintaxe:
# D <TIPO_VM> <DIR_INPUTS> <CAMINHO_EXEC> <RAM> <DISCO> <VCPUS>
# -------------------------------------------------------------------
# Exemplo 1: Define a VM "V1" (2GB RAM, 50GB Disco, 4 vCPUs)
D V7 input ls 2 50 4
# Exemplo 2: Define a VM "Vx" (4GB RAM, 75GB Disco, 6 vCPUs)
D Vxl input ls 4 75 6
# -------------------------------------------------------------------
# COMANDO R (Reservar VMs)
# Sintaxe:
# R <ID_RESERVA> [<TIPO_VM> <QTD> <ID_SERVIDOR>]+
# -------------------------------------------------------------------
# Exemplo: Reserva "R_inicial" contendo:
# - 4x VMs do tipo V1 no Servidor 1
# - 2x VMs do tipo Vx no Servidor 1
R RA V7 4 1 Vxl 2 1
# -------------------------------------------------------------------
# COMANDO A (Arrancar VMs)
# Sintaxe:
# A <ID_RESERVA>
# -------------------------------------------------------------------
# Exemplo: Executa as VMs de "R_inicial":
A RA
# -------------------------------------------------------------------
# COMANDO L (Listar VMs)
# Sintaxe:
# L
# -------------------------------------------------------------------
# Exemplo: Lista o estado e detalhes de todas as VMs atualmente em execução
L
# -------------------------------------------------------------------
# COMANDO E (Esperar / Pausa)
# Sintaxe:
# E <MS>
# -------------------------------------------------------------------
# Exemplo: Aguarda 5000 ms (5 segundos) antes de processar o próximo comando
E 5000